name: API Parity Audit

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

jobs:
  parity-audit:
    runs-on: ubuntu-latest
    env:
      # Phase 2 and Phase 3 are now enforced.
      ENFORCE_UNCLASSIFIED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Generate parity reports
        run: node tools/api-parity-audit.js --format both

      - name: Enforce Phase 2 (frontend-only must be zero)
        run: node tools/api-parity-audit.js --format both --fail-on frontend-only

      - name: Enforce Phase 3 (unclassified backend-only must be zero)
        if: env.ENFORCE_UNCLASSIFIED == 'true'
        run: node tools/api-parity-audit.js --format both --fail-on unclassified

      - name: Upload parity artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-parity-audit
          path: |
            docs/API_PARITY_AUDIT.md
            docs/api-parity/audit-latest.json
            docs/api-parity/parity-registry.json
            docs/INTENTIONAL_BACKEND_ONLY_APIS.md
